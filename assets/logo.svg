<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Centinela</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="0.55" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#C2187A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23264A"/>
      <stop offset="1" stop-color="#14162E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#sky)"/>
  <circle cx="512" cy="470" r="420" fill="url(#glow)"/>

  <!-- Owl sentinel: ear tufts, round head and a shield-shaped body. -->
  <path d="M286 196 L414 300 Q512 276 610 300 L738 196 L756 430 Q800 590 742 724 Q672 874 512 892 Q352 874 282 724 Q224 590 268 430 Z"
        fill="url(#body)"/>

  <!-- Eyes: amber rings, white sclera, pupils looking down at the diff. -->
  <circle cx="404" cy="498" r="122" fill="#FFC23D"/>
  <circle cx="620" cy="498" r="122" fill="#FFC23D"/>
  <circle cx="404" cy="498" r="94" fill="#FFFFFF"/>
  <circle cx="620" cy="498" r="94" fill="#FFFFFF"/>
  <circle cx="414" cy="518" r="50" fill="#14162E"/>
  <circle cx="630" cy="518" r="50" fill="#14162E"/>
  <circle cx="396" cy="498" r="16" fill="#FFFFFF"/>
  <circle cx="612" cy="498" r="16" fill="#FFFFFF"/>

  <!-- Brow that joins the eyes like a merge line. -->
  <path d="M300 392 Q404 340 512 404 Q620 340 724 392" fill="none" stroke="#FFC23D" stroke-width="22" stroke-linecap="round"/>

  <!-- Beak. -->
  <path d="M512 588 L478 630 L512 690 L546 630 Z" fill="#FFC23D"/>

  <!-- Chest mark: an approval check. -->
  <path d="M424 768 L486 826 L606 712" fill="none" stroke="#4BE3A0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

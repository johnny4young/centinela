name: Centinela Execute (Opt-in Tier 2)

# Strictly separated from pull_request_target: only runs when a maintainer explicitly comments
# `/centinela draft-pr` on an issue. Opens a Draft PR on a new branch, which is then reviewed
# independently by the Control Plane (Tier 1) Centinela workflow.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  draft-pr:
    name: Draft PR from issue
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/centinela draft-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Acknowledge command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes
      - name: Run autonomous implementation agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Implement issue #${{ github.event.issue.number }} on a new branch and open a Draft PR referencing it.
            Follow AGENTS.md / CLAUDE.md strictly, add regression tests, and run the project test suite before opening the Draft PR.
            Never merge or approve your own PR.
